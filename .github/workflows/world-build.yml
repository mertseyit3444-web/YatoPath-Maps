name: Build verified world map packages
on:
  workflow_dispatch:
    inputs:
      sources:
        description: Optional comma separated audited source IDs
        type: string
        default: ''
      shard:
        description: Source batch 0, 1 or 2 (180 sources per batch)
        type: choice
        options: ['0', '1', '2']
        default: '0'
permissions:
  contents: read
concurrency:
  group: world-production-${{ inputs.shard }}-${{ inputs.sources }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests shapely osmium
      - id: matrix
        env:
          SOURCE_IDS: ${{ inputs.sources }}
          SHARD: ${{ inputs.shard }}
        run: |
          MATRIX=$(python tools/world_release.py matrix --inventory world/inventory.json --sources "$SOURCE_IDS" --shard "$SHARD")
          echo "value=$MATRIX" >> "$GITHUB_OUTPUT"
  build:
    needs: plan
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare verified tools
        run: |
          python -m pip install requests shapely osmium
          curl --fail --location https://github.com/protomaps/go-pmtiles/releases/download/v1.31.2/go-pmtiles_1.31.2_Linux_x86_64.tar.gz --output pmtiles.tar.gz
          echo '3ed7dbf4ec2e6dfe5e25b6f70d1ffc932729f93c86db353bf514dd71010a312f  pmtiles.tar.gz' | sha256sum --check
          tar -xzf pmtiles.tar.gz pmtiles
          python -m unittest tools.test_region_pipeline tools.test_world_inventory tools.test_world_release tools.test_source_download tools.test_repository_destination tools.test_semantic_receipts -v
      - name: Produce and verify one source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_ID: ${{ matrix.source }}
        run: |
          python -u tools/world_release.py build --inventory world/inventory.json --source "$SOURCE_ID" --pmtiles-bin ./pmtiles --work outputs/world --publish
      - name: Preserve production receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: receipt-${{ strategy.job-index }}
          path: |
            outputs/world/*/receipt.json
            outputs/world/*/catalog.json
            outputs/world/*/source-provenance.json
            outputs/world/*/semantic-receipt.json
          retention-days: 30
